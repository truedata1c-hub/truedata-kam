name: deploy
# Выпуск на стенд: тег вида v0.1.0 или ручной запуск с указанием версии.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Имя версии (например, v0.1.0-rc1)
        required: true
      transport:
        description: Доставка образа на VPS (registry — скачивание из ghcr.io только изменённых слоёв; archive — весь образ архивом через SSH)
        required: false
        default: registry
        type: choice
        options: [registry, archive]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-stand
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: stand
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      TRANSPORT: ${{ github.event.inputs.transport || 'registry' }}
      REGISTRY_IMAGE: ghcr.io/truedata1c-hub/truedata-kam
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Проверка перед выпуском
        run: |
          [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]] || { echo "Некорректная версия: $VERSION"; exit 1; }
          npm ci
          npm run typecheck
          npm test
      - uses: docker/setup-buildx-action@v3
      - name: Вход в реестр образов GitHub
        if: env.TRANSPORT == 'registry'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Сборка образа
        # Кэш слоёв между выпусками: пересобираются только изменённые слои.
        run: |
          if [[ "$TRANSPORT" == registry ]]; then
            docker buildx build --push --cache-from type=gha --cache-to type=gha,mode=max \
              -t "$REGISTRY_IMAGE:$VERSION" .
          else
            docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max \
              -t "truedata-kam:$VERSION" .
          fi
      - name: Ключ развёртывания
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Выпуск на VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "kam-deploy@$VPS_HOST")
          if [[ "$TRANSPORT" == registry ]]; then
            # Сервер сам скачивает образ из ghcr.io: передаются только слои, которых у него ещё нет.
            "${SSH[@]}" "pull $VERSION" < /dev/null
          else
            docker save "truedata-kam:$VERSION" | gzip -1 | "${SSH[@]}" "$VERSION"
          fi
      - name: Проверка по адресу стенда
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 https://kam.demo.truedata.tech/healthz; then exit 0; fi
            sleep 3
          done
          echo "Стенд не ответил по https://kam.demo.truedata.tech/healthz"
          exit 1
      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key
